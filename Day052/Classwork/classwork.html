<!DOCTYPE html>
<html>
<body>

<p id="output"></p>

<script>


function Person(name, surname, age) {
    this.name = name;
    this.surname = surname;
    this.age = age;

    this.talk = function() {
        document.getElementById("output").innerHTML =
        "Hello, my name is " + this.name;
    }
}

function Dog(name, surname, breed) {
    this.name = name;
    this.surname = surname;
    this.breed = breed;

    this.bark = function() {
        document.getElementById("output").innerHTML =
        "Bark bark bark";
    }
}


let person1 = new Person("Luka", "Qiria", 15);
let dog1 = new Dog("Max", "Brown", "Labrador");

person1.talk();
dog1.bark();



</script>
</body>
</html>
